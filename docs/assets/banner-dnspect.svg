<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">DNSpect banner</title>
  <desc id="desc">Minimal banner showing local DNS benchmark flow from input to ranking output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="4" fill="url(#accent)"/>

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#e5e7eb">
    <text x="80" y="120" font-size="56" font-weight="700">DNSpect</text>
    <text x="80" y="166" font-size="24" fill="#93c5fd">Deterministic local DNS resolver benchmark</text>
    <text x="80" y="206" font-size="20" fill="#9ca3af">Measure query latency, reliability, and stability from your own network path.</text>
  </g>

  <g transform="translate(760 78)" filter="url(#softShadow)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="220" height="64" rx="12" fill="#111827" stroke="#334155"/>
    <text x="110" y="39" text-anchor="middle" font-size="18" fill="#e2e8f0">Input + Validation</text>

    <rect x="270" y="0" width="220" height="64" rx="12" fill="#111827" stroke="#334155"/>
    <text x="380" y="39" text-anchor="middle" font-size="18" fill="#e2e8f0">Resolution Engine</text>

    <rect x="540" y="0" width="220" height="64" rx="12" fill="#111827" stroke="#334155"/>
    <text x="650" y="39" text-anchor="middle" font-size="18" fill="#e2e8f0">Scoring + Output</text>

    <line x1="220" y1="32" x2="270" y2="32" stroke="#22d3ee" stroke-width="3"/>
    <polygon points="270,32 258,24 258,40" fill="#22d3ee"/>

    <line x1="490" y1="32" x2="540" y2="32" stroke="#22d3ee" stroke-width="3"/>
    <polygon points="540,32 528,24 528,40" fill="#22d3ee"/>

    <text x="0" y="112" font-size="16" fill="#94a3b8">FastAPI + Pydantic - drill/dnspython - deterministic ranking</text>
  </g>

  <g fill="#14b8a6" opacity="0.16">
    <circle cx="1450" cy="85" r="72"/>
    <circle cx="1320" cy="345" r="110"/>
  </g>
</svg>
