name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r constraints.txt -e .[dev]

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Bandit
        run: bandit -q -c pyproject.toml -r app

      - name: Pytest
        run: pytest -q

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep==1.152.0

      - name: Semgrep scan
        run: semgrep scan --config p/python --error --exclude backend/tests backend/app

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Frontend tests (vitest)
        run: npm test

      - name: Browser regression tests (Playwright Chromium)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- --project=chromium

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1 -c backend/constraints.txt

      - name: Python lock audit
        run: pip-audit -r backend/constraints.txt --no-deps --progress-spinner off

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm lock audit
        run: npm audit --package-lock-only
        working-directory: frontend

  packaged-linux-smoke:
    name: packaged-linux-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt

      - name: Install backend packaging deps
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -e "./backend[pack,doq]"

      - name: Verify backports packaging dependency
        run: python -c "import backports, backports.tarfile"

      - name: Verify aioquic packaging dependency
        run: python -c "import aioquic, aioquic.quic"

      - name: Build packaged binary
        run: python scripts/package_backend.py

      - name: Prepare Linux artifact name
        run: |
          mkdir -p release-assets
          cp dist/dnspect-linux release-assets/dnspect-linux-x64
          chmod +x release-assets/dnspect-linux-x64

      - name: Smoke test packaged Linux artifact
        run: bash scripts/smoke_packaged_linux.sh release-assets/dnspect-linux-x64

  packaged-windows-smoke:
    name: packaged-windows-smoke
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt

      - name: Install backend packaging deps
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -e ".\backend[pack,doq]"

      - name: Verify backports packaging dependency
        run: python -c "import backports, backports.tarfile"

      - name: Verify aioquic packaging dependency
        run: python -c "import aioquic, aioquic.quic"

      - name: Build packaged binary
        run: python scripts/package_backend.py

      - name: Prepare Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets
          Copy-Item dist\dnspect-windows.exe release-assets\dnspect-windows-x64.exe

      - name: Smoke test packaged Windows artifact
        shell: pwsh
        run: ./scripts/smoke_packaged_windows.ps1 -BinaryPath release-assets\dnspect-windows-x64.exe
