name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            source_binary: dns-speed-lab-linux
            asset_name: dnspect-linux-x64
            node_arch: x64
            python_arch: x64
          - os: windows-latest
            source_binary: dns-speed-lab-windows.exe
            asset_name: dnspect-windows-x64.exe
            node_arch: x64
            python_arch: x64
          - os: macos-14
            source_binary: dns-speed-lab-darwin
            asset_name: dnspect-macos-arm64
            node_arch: arm64
            python_arch: arm64
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
      LC_ALL: C
      LANG: C
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set deterministic build timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          architecture: ${{ matrix.node_arch }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt

      - name: Install backend packaging deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -e "./backend[pack]"

      - name: Build packaged binary
        shell: bash
        run: python scripts/package_backend.py

      - name: Rename release artifact
        shell: bash
        run: |
          mkdir -p release-assets
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          src = Path("dist") / os.environ["SRC_BINARY"]
          dst = Path("release-assets") / os.environ["ASSET_NAME"]
          if not src.exists():
              raise SystemExit(f"Expected build output not found: {src}")
          shutil.copy2(src, dst)
          if os.name != "nt":
              dst.chmod(dst.stat().st_mode | 0o111)
          print(f"Prepared release asset: {dst}")
          PY
        env:
          SRC_BINARY: ${{ matrix.source_binary }}
          ASSET_NAME: ${{ matrix.asset_name }}

      - name: Verify macOS artifact architecture
        if: ${{ startsWith(matrix.os, 'macos') }}
        shell: bash
        run: |
          artifact="release-assets/${{ matrix.asset_name }}"
          if [[ ! -f "$artifact" ]]; then
            echo "::error::Artifact not found for architecture validation: $artifact"
            exit 1
          fi

          case "${{ matrix.asset_name }}" in
            dnspect-macos-arm64) expected_arch="arm64" ;;
            *)
              echo "::error::Unexpected macOS artifact name: ${{ matrix.asset_name }}"
              exit 1
              ;;
          esac

          file_info="$(file "$artifact")"
          echo "$file_info"
          if ! echo "$file_info" | grep -q "$expected_arch"; then
            echo "::error::Architecture mismatch for $artifact. Expected token '$expected_arch' in 'file' output."
            exit 1
          fi

          if echo "$file_info" | grep -q "Mach-O"; then
            lipo_info="$(lipo -info "$artifact")"
            echo "$lipo_info"
            if ! echo "$lipo_info" | grep -q "$expected_arch"; then
              echo "::error::Architecture mismatch for $artifact. Expected token '$expected_arch' in 'lipo -info' output."
              exit 1
            fi
            archs="$(lipo -archs "$artifact" | xargs)"
            echo "lipo -archs: $archs"
            if [[ "$archs" == *"x86_64"* && "$archs" == *"arm64"* ]]; then
              echo "::error::Universal binary detected for $artifact ($archs), but per-arch asset '${{ matrix.asset_name }}' is required. Publish as dnspect-macos-universal if desired."
              exit 1
            fi
            if [[ "${{ matrix.asset_name }}" == "dnspect-macos-arm64" && "$archs" != "arm64" ]]; then
              echo "::error::Architecture mismatch for $artifact. Expected exactly 'arm64' from 'lipo -archs', got '$archs'."
              exit 1
            fi
          else
            echo "Skipping lipo validation because artifact is not Mach-O: $artifact"
          fi

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release-assets/${{ matrix.asset_name }}
          if-no-files-found: error

  publish:
    name: publish-release
    runs-on: ubuntu-latest
    needs: build
    env:
      TZ: UTC
      LC_ALL: C
      LANG: C
    steps:
      - name: Download all executable artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Debug release-assets contents
        shell: bash
        run: ls -la release-assets

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd release-assets
          cat > .artifact-list <<'EOF'
          dnspect-linux-x64
          dnspect-windows-x64.exe
          dnspect-macos-arm64
          EOF
          : > checksums.txt
          while IFS= read -r artifact; do
            [[ -f "$artifact" ]] || { echo "Missing artifact: $artifact" >&2; exit 1; }
            sha256sum "$artifact" >> checksums.txt
          done < .artifact-list
          rm -f .artifact-list
          cat checksums.txt

      - name: Detect GPG signing availability
        id: gpg_setup
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ -n "$GPG_PRIVATE_KEY" && -n "$GPG_PASSPHRASE" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import GPG key
        if: ${{ steps.gpg_setup.outputs.enabled == 'true' }}
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          if [[ "$GPG_PRIVATE_KEY" == *"BEGIN PGP PRIVATE KEY BLOCK"* ]]; then
            printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          else
            printf '%s' "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          fi

      - name: Sign checksums.txt
        if: ${{ steps.gpg_setup.outputs.enabled == 'true' }}
        shell: bash
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output release-assets/checksums.txt.sig \
            --detach-sign release-assets/checksums.txt

      - name: Upload assembled release assets (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-bundle
          path: release-assets/*

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/dnspect-linux-x64
            release-assets/dnspect-windows-x64.exe
            release-assets/dnspect-macos-arm64
            release-assets/checksums.txt
            release-assets/checksums.txt.sig
          fail_on_unmatched_files: false
          generate_release_notes: true
